<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moose Lodge 2010 social calendar and lodge events in Palm Beach Gardens, Florida.">
  <title>Social Calendar | Moose Lodge 2010</title>
  <style>
    :root { color-scheme: dark; --navy:#081d36; --blue:#12375c; --gold:#e6b75c; --cream:#f7f1e4; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(145deg,var(--navy),var(--blue)); color:var(--cream); font-family:Arial,Helvetica,sans-serif; min-height:100vh; }
    header { text-align:center; padding:28px 16px 14px; }
    h1 { color:var(--gold); font-size:clamp(1.7rem,4vw,3rem); margin:0 0 6px; }
    .subtitle { margin:0; font-size:clamp(1rem,2vw,1.2rem); }
    nav { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin:20px auto; padding:0 12px; }
    nav a { display:inline-block; text-decoration:none; color:#081d36; background:var(--gold); border:2px solid #f6d99a; border-radius:9px; padding:12px 22px; font-weight:bold; }
    nav a:hover,nav a:focus-visible { background:#fff0c8; outline:2px solid white; outline-offset:2px; }
    main { width:min(1500px,96%); margin:0 auto 36px; }
    .calendar-frame { background:#fff; padding:12px; border:3px solid var(--gold); border-radius:14px; box-shadow:0 10px 35px #0006; }
    .calendar-frame img { display:block; width:100%; height:auto; object-fit:contain; }
    .note { text-align:center; font-size:.95rem; margin:16px auto; }
    footer { text-align:center; padding:18px; background:#06172b; font-size:.95rem; }
    footer a { color:var(--gold); }
  </style>
</head>
<body>
  <header>
    <h1>Moose Lodge 2010</h1>
    <p class="subtitle">October 2026 Social Calendar</p>
  </header>
  <nav aria-label="Page navigation">
    <a href="index.html">&#8592; Back to Home</a>
    <a href="sports-calendar.html">Sports Calendar</a>
  </nav>
  <main>
    <div class="calendar-frame">
      <img src="calendars/octcal.png" alt="Moose Lodge 2010 October 2026 social events calendar" loading="eager">
    </div>
    <p class="note">Select or zoom in on the calendar to read event details. Events are subject to change.</p>
  </main>
  <footer>
    3600 RCA Blvd, Palm Beach Gardens, FL 33410<br>
    <a href="mailto:pbgardens@moose2010.com">pbgardens@moose2010.com</a>
  </footer>
</body>
</html>
