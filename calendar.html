<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Moose Lodge 2010 social activities calendar for October 2026.">
  <title>Social Calendar | Moose Lodge 2010</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #071a32; color: #f7f4e9; }
    header { text-align: center; padding: 32px 16px 22px; background: linear-gradient(135deg,#092346,#163b63); border-bottom: 3px solid #d4ae58; }
    .eyebrow { color: #e2c47c; font-size: .9rem; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(2rem,5vw,3.1rem); }
    header p { margin: 0; color: #d6e1ee; }
    nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 22px auto; padding: 0 12px; }
    nav a { display: inline-block; padding: 12px 20px; border: 1px solid #d4ae58; border-radius: 9px; background: #19395c; color: white; font-weight: bold; text-decoration: none; }
    nav a:hover, nav a:focus-visible { background: #d4ae58; color: #071a32; }
    main { width: min(1300px,96%); margin: 0 auto 38px; }
    h2 { text-align: center; color: #f4d58a; font-size: clamp(1.4rem,3vw,2rem); }
    .calendar-frame { padding: 12px; background: white; border: 3px solid #d4ae58; border-radius: 12px; box-shadow: 0 12px 35px #0005; }
    .calendar-frame img { display: block; width: 100%; height: auto; object-fit: contain; }
    .note { text-align: center; color: #d6e1ee; margin-top: 16px; }
    footer { text-align: center; padding: 22px 12px; border-top: 1px solid #3c5675; color: #d6e1ee; }
    footer a { color: #f4d58a; }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Palm Beach Gardens, Florida</div>
    <h1>Moose Lodge 2010</h1>
    <p>Social Calendar &amp; Lodge Activities</p>
  </header>
  <nav aria-label="Website navigation">
    <a href="index.html">⌂ Home</a>
    <a href="sports-calendar.html">🏆 Sports Calendar</a>
  </nav>
  <main>
    <h2>October 2026 Social Calendar</h2>
    <div class="calendar-frame">
      <img src="calendars/octcal.png" alt="Moose Lodge 2010 October 2026 social activities calendar">
    </div>
    <p class="note">Join us for activities and events at the lodge!</p>
  </main>
  <footer>
    3600 RCA Blvd, Palm Beach Gardens, FL 33410<br>
    <a href="mailto:pbgardens@moose2010.com">pbgardens@moose2010.com</a>
  </footer>
</body>
</html>
