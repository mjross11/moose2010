<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker at the Moose</title>
  <meta name="description" content="7-card stud every Saturday at noon and Texas Hold ’em every Sunday at 12:30 PM at the Moose.">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #09291f; color: #fff8df; font-family: Arial, sans-serif; }
    main { width: min(100%, 1000px); margin: 0 auto; padding: 20px 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 12px 36px #0006; }
    .schedule { text-align: center; line-height: 1.6; margin: 20px 0 0; }
    .schedule p { margin: 4px 0; }
    a { color: #f3d080; }
    @media print { body { background: white; color: black; } main { padding: 0; } img { box-shadow: none; } .schedule { display: none; } }
  </style>
</head>
<body>
  <main>
    <img src="poker/poker.png" alt="Poker at the Moose: 7-card stud every Saturday at 12:00 PM (noon). Texas Hold ’em every Sunday at 12:30 PM.">
    <div class="schedule">
      <p><strong>7-Card Stud:</strong> Every Saturday at 12:00 PM (noon)</p>
      <p><strong>Texas Hold ’em:</strong> Every Sunday at 12:30 PM</p>
      <p><a href="poker/poker.png" download="poker.png">Download poker flyer</a></p>
    </div>
  </main>
</body>
</html>
