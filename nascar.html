<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NASCAR racing at Palm Beach Gardens Moose Lodge 2010.">
  <title>NASCAR | Moose Lodge 2010</title>
  <link rel="stylesheet" href="switchboard.css">
  <style>
    :root { color-scheme: dark; }
    body { margin:0; background:#08182d; color:#f5f7fc; font-family:Arial,Helvetica,sans-serif; }
    .nascar-wrap { width:min(1100px,94%); margin:0 auto; padding:32px 0 48px; text-align:center; }
    .nascar-header { padding:22px 12px 16px; }
    .nascar-header .eyebrow { color:#e7c679; text-transform:uppercase; letter-spacing:.16em; font-size:.78rem; font-weight:700; }
    .nascar-header h1 { font-size:clamp(2rem,5vw,3.5rem); margin:12px 0 8px; color:#fff; }
    .nascar-header h1 span { color:#f0c766; }
    .nascar-header p { color:#cdd8e8; margin:0; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin:24px 0; }
    .actions a { display:inline-block; text-decoration:none; background:#d6ac54; color:#10213b; padding:12px 22px; border-radius:12px; font-weight:700; }
    .actions a.secondary { background:#233b59; color:#fff; border:1px solid #637b9a; }
    .actions a:hover,.actions a:focus-visible { filter:brightness(1.12); outline-offset:3px; }
    .poster { padding:clamp(8px,2vw,20px); border:2px solid #bd9650; border-radius:18px; background:#122744; box-shadow:0 15px 40px #0005; }
    .poster img { display:block; width:100%; height:auto; object-fit:contain; border-radius:8px; }
    .footer { color:#aebed1; margin-top:28px; font-size:.9rem; }
  </style>
</head>
<body>
  <main class="nascar-wrap">
    <header class="nascar-header">
      <div class="eyebrow">Palm Beach Gardens, Florida</div>
      <h1>Moose Lodge <span>2010</span></h1>
      <p>NASCAR • Racing Schedule &amp; Updates</p>
    </header>
    <nav class="actions" aria-label="Page navigation">
      <a href="index.html">⌂ Home</a>
      <a class="secondary" href="sports-calendar.html">🏆 Sports Calendar</a>
    </nav>
    <section class="poster" aria-label="NASCAR schedule poster">
      <img src="nascar/nascar.png" alt="Moose Lodge NASCAR schedule and racing information">
    </section>
    <footer class="footer">3600 RCA Blvd, Palm Beach Gardens, FL 33410</footer>
  </main>
</body>
</html>
